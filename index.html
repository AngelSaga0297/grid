<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID</title>
</head>
<link rel="stylesheet" href="style.css">
<body>

    <div class="parent">
        <div class="div1">
            <div class="search">
                <input type="text">
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg>
                  </div>
            </div>
        </div>
        <div class="div2">
            <section class="options-list">
                <div class="option">My Likes</div>
                <div class="option">My Playlists</div>
                <div class="option">My Albums</div>
                <div class="option">My History</div>
                <div class="option">My Artists</div>
            </section>
        </div>
        <div class="div3">
          <div class="music-upload-container">
              <input type="file" id="mp3-upload" accept=".mp3" style="display: none;" multiple>
              <button class="upload-btn" onclick="document.getElementById('mp3-upload').click()">
                  Subir MP3
              </button>
              <div class="music-list" id="music-list">
                  Las canciones subidas aparecerán aquí
              </div>
          </div>
        </div>
        <div class="div4">
          <div class="music-player">
            <div class="album-art-placeholder"></div>
            <div class="song-info">
                <div class="song-title">Canción Ejemplo</div>
                <div class="artist">Artista Desconocido</div>
            </div>
            <div class="player-controls">
                <button class="control-btn prev">⏮</button>
                <button class="control-btn play">▶</button>
                <button class="control-btn next">⏭</button>
            </div>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
          </div>
        </div>
    </div>
    
</body>

<script src="script.js"></script>
</html>
